# ─────────────────────────────────────────────────────────────
# ローカル開発環境。frontend / backend / queue も含めて「全部Docker」
# （docs/infra/local-dev.md）。一度に全部は作らず、ロードマップのフェーズ1の
# ステップどおり段階的に足していく:
#
#   Step 2 : db / rustfs / mailpit だけ。まず土台の疎通を確認する
#   Step 4 : backend（serversideup/php）を追加
#   Step 6 : frontend（next dev）を追加  ← いまここ
#   Step 7 : queue worker / scheduler を追加
#
# コンテナ名はecp5-*（前回系譜ecp4-*の次世代）。
#
# 使い方:
#   docker compose up -d        # 起動
#   docker compose down         # 停止（データはvolumeに残る）
#   docker compose down -v      # データごと破棄
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ecp5-db
    environment:
      # backend/.envのDB_DATABASE / DB_USERNAME / DB_PASSWORDと一致させること
      POSTGRES_DB: ecp
      POSTGRES_USER: ecp
      POSTGRES_PASSWORD: ecpsecret
    ports:
      - "5432:5432"
    volumes:
      - ecp5-pgdata:/var/lib/postgresql/data
      # 初回起動（空ボリューム）時に一度だけ実行。テスト用DB(ecp_test)を作る
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecp -d ecp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── RustFS（S3互換ストレージ）────────────────────────────
  # 商品・CMS画像の置き場。本番はRailway Storage Bucket（S3互換）なので、
  # ローカルもS3 APIで話せるものを使う。
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: ecp5-rustfs
    environment:
      # ルート資格情報。backend/.envとfrontend/.env.localのAWS_* / BUCKET_*に使う
      RUSTFS_ACCESS_KEY: ecp
      RUSTFS_SECRET_KEY: ecpsecret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000" # S3 API（Laravel / Next.jsからのアクセス先）
      - "9001:9001" # 管理コンソール（ブラウザでhttp://localhost:9001/rustfs/console/）
    volumes:
      - ecp5-rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── バケット初期化（使い捨て）─────────────────────────────
  # rustfsがhealthyになったら1回だけ実行してバケットを作る（既にあれば何もしない）。
  createbuckets:
    image: amazon/aws-cli:2.38.1
    container_name: ecp5-createbuckets
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ecp
      AWS_SECRET_ACCESS_KEY: ecpsecret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ec3-media 2>/dev/null ||
      aws --endpoint-url http://rustfs:9000 s3 mb s3://ec3-media &&
      echo 'bucket ec3-media ready';
      "
    restart: "no"

  # ── backend（Laravel / serversideup/php）────────────────────
  # nginx + php-fpmを同梱した本番向けイメージ。ローカルも本番も同じイメージを使う
  # （本番はdocs/infra/railway.mdの薄いDockerfileでコードを焼き込む。ローカルは./backendをマウント）。
  backend:
    image: serversideup/php:8.4-fpm-nginx
    container_name: ecp5-backend
    volumes:
      # ソースをマウントしてホットリロード（php-fpmはリクエストごとに読み直す）
      - ./backend:/var/www/html
    environment:
      # serversideup側の運用フラグのみ。Laravelの設定は./backend/.envをアプリ自身が
      # ディスクから読む（env_fileで注入するとAPP_ENV / DB_*が実コンテナ環境変数になり、
      # phpunit.xmlの<env>がテストDBを上書きできなくなる。docs/infra/local-dev.md）。
      SSL_MODE: "off"
      PHP_OPCACHE_ENABLE: "0"
      AUTORUN_ENABLED: "false"
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── frontend（Next.js / next dev）───────────────────────────
  # ブラウザが直接触るページサーバー。ソースをマウントしてホットリロード。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ecp5-frontend
    volumes:
      - ./frontend:/app
      # node_modulesはホストと共有しない（Mac/Linuxでネイティブバイナリが違う・遅い）。
      # 名前付きボリュームに隔離する（ホストのnode_modulesはIDE補完用に別途npm ci）
      - ecp5-frontend-node_modules:/app/node_modules
      # .nextのビルドキャッシュもコンテナ内に閉じる
      - ecp5-frontend-next:/app/.next
    environment:
      # MacのDocker Desktopはファイル変更検知が効かないことがあるのでpollingを有効化
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - rustfs

  # ── Mailpit（ローカルのSMTP受信箱）──────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecp5-mailpit
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025" # Web UI
      # SMTP(1025)はコンテナ間通信のみ。ホストには公開しない

# ── 永続ボリューム ─────────────────────────────────────────
volumes:
  ecp5-pgdata:
  ecp5-rustfs:
  ecp5-frontend-node_modules:
  ecp5-frontend-next:
